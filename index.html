<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Objevuj Zeměkouli! 🌍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff5d8f;
    --yellow:#ffd60a;
    --purple:#9d4edd;
    --green:#40916c;
    --dark:#22223b;
    --card-bg:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Baloo 2', sans-serif;
    background:linear-gradient(160deg,#bde0fe 0%, #a2d2ff 50%, #cdb4db 100%);
    min-height:100vh;
    color:var(--dark);
    overflow-x:hidden;
    transition:background 0.6s ease;
  }
  body.theme-ocean{background:linear-gradient(160deg,#48cae4 0%,#0096c7 55%,#023e8a 100%);}
  body.theme-rainforest{background:linear-gradient(160deg,#b7e4c7 0%,#52b788 55%,#1b4332 100%);}
  body.theme-desert{background:linear-gradient(160deg,#ffe8a3 0%,#ffc971 55%,#c97b3c 100%);}
  body.theme-arctic{background:linear-gradient(160deg,#ffffff 0%,#caf0f8 55%,#76c8e8 100%);}
  body.theme-savannah{background:linear-gradient(160deg,#ffe066 0%,#ffc300 55%,#b07d3a 100%);}
  body.theme-reef{background:linear-gradient(160deg,#9efce0 0%,#56cfe1 55%,#ff8fab 100%);}
  body.theme-dinosaurs{background:linear-gradient(160deg,#cdb98f 0%,#a98467 55%,#4b3621 100%);}

  #app{
    max-width:900px;
    margin:0 auto;
    padding:14px 14px 60px;
    min-height:100vh;
  }

  /* ===== HEADER ===== */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:14px;
  }
  .title-row{
    display:flex;
    align-items:center;
    gap:10px;
    flex:1;
    min-width:0;
  }
  .big-title{
    font-size:1.9rem;
    font-weight:800;
    color:#fff;
    text-shadow:0 2px 6px rgba(0,0,0,0.25);
    margin:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .icon-btn{
    background:#fff;
    border:none;
    border-radius:50%;
    width:64px;
    height:64px;
    font-size:2rem;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,0.18);
    flex-shrink:0;
    transition:transform 0.15s ease;
  }
  .icon-btn:active{transform:scale(0.9);}
  .badge-counter{
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(255,255,255,0.9);
    border-radius:999px;
    padding:8px 14px;
    font-weight:700;
    font-size:1.2rem;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
    cursor:pointer;
    flex-shrink:0;
    transition:transform 0.15s ease;
  }
  .badge-counter:active{transform:scale(0.95);}

  /* ===== HOME SCREEN ===== */
  .home-intro{
    text-align:center;
    color:#fff;
    text-shadow:0 2px 8px rgba(0,0,0,0.3);
    margin:6px 0 20px;
  }
  .home-intro h1{
    font-size:2.3rem;
    margin:4px 0;
    font-weight:800;
  }
  .home-intro p{
    font-size:1.3rem;
    margin:2px 0;
    font-weight:600;
    opacity:0.95;
  }
  .habitat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px,1fr));
    gap:16px;
  }
  .habitat-card{
    border-radius:24px;
    padding:22px 14px;
    text-align:center;
    cursor:pointer;
    border:none;
    color:#fff;
    font-family:inherit;
    font-weight:800;
    font-size:1.3rem;
    box-shadow:0 8px 18px rgba(0,0,0,0.22);
    transition:transform 0.18s ease, box-shadow 0.18s ease;
    position:relative;
    overflow:hidden;
  }
  .habitat-card:active{transform:scale(0.95);}
  .habitat-card .emoji{
    font-size:4.5rem;
    display:block;
    margin-bottom:8px;
    animation:float 3s ease-in-out infinite;
  }
  .habitat-card .badge-check{
    position:absolute;
    top:8px;
    right:8px;
    background:#fff;
    border-radius:50%;
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.1rem;
    box-shadow:0 2px 6px rgba(0,0,0,0.2);
  }
  .hc-ocean{background:linear-gradient(150deg,#48cae4,#023e8a);}
  .hc-rainforest{background:linear-gradient(150deg,#95d5b2,#1b4332);}
  .hc-desert{background:linear-gradient(150deg,#ffd97d,#c97b3c);}
  .hc-arctic{background:linear-gradient(150deg,#caf0f8,#0077b6); color:#04293a;}
  .hc-savannah{background:linear-gradient(150deg,#ffe066,#b07d3a);}
  .hc-reef{background:linear-gradient(150deg,#72efdd,#ff5d8f);}
  .hc-dinosaurs{background:linear-gradient(150deg,#a98467,#3d2b1f);}

  @keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-8px);}
  }

  /* ===== HABITAT SCREEN ===== */
  .habitat-banner{
    border-radius:20px;
    padding:16px;
    text-align:center;
    color:#fff;
    margin-bottom:16px;
    box-shadow:0 6px 16px rgba(0,0,0,0.2);
  }
  .habitat-banner .emoji-big{
    font-size:4.5rem;
    display:block;
  }
  .habitat-banner h2{
    margin:4px 0 0;
    font-size:2rem;
    font-weight:800;
    text-shadow:0 2px 6px rgba(0,0,0,0.25);
  }

  .animal-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(125px,1fr));
    gap:22px;
    margin:18px 0;
  }
  .animal-spot{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    cursor:pointer;
    border:none;
    background:none;
    font-family:inherit;
    color:#fff;
    text-shadow:0 1px 4px rgba(0,0,0,0.35);
  }
  .animal-circle{
    width:104px;
    height:104px;
    border-radius:50%;
    background:rgba(255,255,255,0.92);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:3.4rem;
    position:relative;
    box-shadow:0 6px 14px rgba(0,0,0,0.2);
    animation:pulse-ring 2.2s infinite;
    overflow:hidden;
  }
  .animal-circle img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
  }
  .animal-spot:active .animal-circle{transform:scale(0.92);}
  .animal-spot .animal-name{
    font-size:1.05rem;
    font-weight:700;
    text-align:center;
    line-height:1.1;
  }
  @keyframes pulse-ring{
    0%{box-shadow:0 0 0 0 rgba(255,255,255,0.7), 0 6px 14px rgba(0,0,0,0.2);}
    70%{box-shadow:0 0 0 14px rgba(255,255,255,0), 0 6px 14px rgba(0,0,0,0.2);}
    100%{box-shadow:0 0 0 0 rgba(255,255,255,0), 0 6px 14px rgba(0,0,0,0.2);}
  }

  /* Did you know box */
  .dyk-box{
    background:#fff8e1;
    border:3px dashed var(--yellow);
    border-radius:18px;
    padding:16px;
    margin:18px 0;
    text-align:center;
    box-shadow:0 6px 14px rgba(0,0,0,0.15);
  }
  .dyk-box .dyk-title{
    font-size:1.35rem;
    font-weight:800;
    color:#b08600;
    margin:0 0 6px;
  }
  .dyk-box p{
    margin:0 0 8px;
    font-size:1.25rem;
    font-weight:600;
    color:#3d2b00;
  }
  .dyk-box p:last-child{margin-bottom:0;}

  .quiz-cta{
    display:block;
    width:100%;
    margin-top:18px;
    padding:20px;
    font-size:1.4rem;
    font-weight:800;
    border:none;
    border-radius:18px;
    background:var(--pink);
    color:#fff;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(0,0,0,0.2);
    font-family:inherit;
    transition:transform 0.15s ease;
  }
  .quiz-cta:active{transform:scale(0.97);}

  /* ===== MODAL (animal card) ===== */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:16px;
    animation:fadeIn 0.2s ease;
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal-card{
    background:#fff;
    border-radius:26px;
    max-width:460px;
    width:100%;
    padding:22px;
    text-align:center;
    box-shadow:0 16px 40px rgba(0,0,0,0.3);
    position:relative;
    animation:popIn 0.25s ease;
    max-height:90vh;
    overflow-y:auto;
  }
  @keyframes popIn{
    from{transform:scale(0.7); opacity:0;}
    to{transform:scale(1); opacity:1;}
  }
  .modal-close{
    position:absolute;
    top:10px;
    right:10px;
    background:#f1f1f1;
    border:none;
    border-radius:50%;
    width:38px;
    height:38px;
    font-size:1.3rem;
    cursor:pointer;
  }
  .modal-emoji{
    font-size:7.5rem;
    display:inline-block;
    animation:bounce 1.2s infinite;
    margin:6px 0;
  }
  .modal-photo{
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:50%;
    display:block;
    margin:6px auto;
    border:4px solid #fff;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
  }
  @keyframes bounce{
    0%,100%{transform:translateY(0) rotate(0deg);}
    25%{transform:translateY(-14px) rotate(-6deg);}
    50%{transform:translateY(0) rotate(0deg);}
    75%{transform:translateY(-8px) rotate(6deg);}
  }
  .modal-card h3{
    margin:6px 0 14px;
    font-size:1.9rem;
    font-weight:800;
  }
  .fact-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    background:#f4f7ff;
    border-radius:14px;
    padding:12px;
    margin-bottom:10px;
    text-align:left;
    font-size:1.2rem;
    font-weight:600;
    line-height:1.35;
  }
  .fact-row .fact-emoji{font-size:1.7rem; flex-shrink:0;}

  /* ===== QUIZ ===== */
  .quiz-progress{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:16px;
  }
  .quiz-dot{
    width:14px;
    height:14px;
    border-radius:50%;
    background:rgba(255,255,255,0.4);
  }
  .quiz-dot.done{background:#fff;}
  .quiz-dot.current{background:var(--yellow); transform:scale(1.3);}
  .quiz-card{
    background:#fff;
    border-radius:22px;
    padding:22px;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
    text-align:center;
  }
  .quiz-card h3{
    font-size:1.6rem;
    margin:0 0 18px;
    font-weight:800;
  }
  .quiz-options{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .quiz-option{
    padding:18px;
    font-size:1.3rem;
    font-weight:700;
    border-radius:14px;
    border:3px solid #e0e0e0;
    background:#fafafa;
    cursor:pointer;
    font-family:inherit;
    transition:transform 0.1s ease, background 0.2s ease, border-color 0.2s ease;
    text-align:left;
  }
  .quiz-option:active{transform:scale(0.98);}
  .quiz-option.correct{
    background:#d8f5e3;
    border-color:var(--green);
  }
  .quiz-option.wrong{
    background:#ffe0e0;
    border-color:#e63946;
  }
  .quiz-option[disabled]{cursor:default;}
  .quiz-feedback{
    margin-top:16px;
    font-size:1.35rem;
    font-weight:800;
    min-height:1.6em;
  }
  .quiz-feedback.correct{color:var(--green);}
  .quiz-feedback.wrong{color:#e63946;}
  .next-btn{
    margin-top:16px;
    padding:14px 28px;
    font-size:1.3rem;
    font-weight:800;
    border:none;
    border-radius:14px;
    background:var(--purple);
    color:#fff;
    cursor:pointer;
    font-family:inherit;
  }

  /* ===== RESULTS ===== */
  .result-card{
    background:#fff;
    border-radius:22px;
    padding:28px 22px;
    text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
  }
  .result-card .result-emoji{
    font-size:6rem;
    display:block;
    animation:bounce 1.2s infinite;
  }
  .result-card h3{font-size:1.9rem; margin:8px 0;}
  .result-card p{font-size:1.3rem; font-weight:600;}
  .result-badge{
    width:150px;
    height:150px;
    border-radius:50%;
    margin:18px auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:5.5rem;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
    border:6px solid var(--yellow);
  }
  .result-actions{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:14px;
  }
  .result-actions button{
    padding:14px 22px;
    font-size:1.05rem;
    font-weight:800;
    border:none;
    border-radius:14px;
    cursor:pointer;
    font-family:inherit;
    color:#fff;
  }
  .btn-home{background:var(--purple);}
  .btn-retry{background:var(--pink);}

  /* ===== BADGES SCREEN ===== */
  .badges-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(130px,1fr));
    gap:18px;
    margin-top:16px;
  }
  .badge-tile{
    background:rgba(255,255,255,0.95);
    border-radius:20px;
    padding:16px 10px;
    text-align:center;
    box-shadow:0 6px 14px rgba(0,0,0,0.18);
  }
  .badge-circle{
    width:104px;
    height:104px;
    border-radius:50%;
    margin:0 auto 8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:3.6rem;
    border:5px solid var(--yellow);
  }
  .badge-tile.locked .badge-circle{
    background:#e0e0e0;
    border-color:#cfcfcf;
    filter:grayscale(1);
    opacity:0.6;
  }
  .badge-tile .badge-name{
    font-weight:800;
    font-size:1.15rem;
  }
  .badge-tile.locked .badge-name{color:#999;}
  .badge-tile .lock-icon{font-size:1.6rem;}

  /* Confetti */
  .confetti{
    position:fixed;
    top:-20px;
    width:10px;
    height:16px;
    border-radius:3px;
    z-index:100;
    pointer-events:none;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{transform:translateY(110vh) rotate(720deg); opacity:0.4;}
  }

  .footer-note{
    text-align:center;
    color:#fff;
    opacity:0.85;
    font-size:0.85rem;
    margin-top:30px;
    text-shadow:0 1px 3px rgba(0,0,0,0.25);
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =======================================================
   DATA: HABITATS, ANIMALS, FACTS, QUIZZES
   ======================================================= */
const HABITATS = [
  {
    id:'ocean', name:'Oceán', emoji:'🌊', theme:'ocean', card:'hc-ocean',
    intro:'Ponoř se do hlubin a poznej obyvatele moří!',
    didYouKnow:[
      'Oceán pokrývá více než dvě třetiny naší planety – a vědci v něm stále objevují nová zvířata!',
      'Nejhlubší místo oceánu je hlubší, než je vysoká hora Mount Everest!',
      'Mnoho mořských zvířat svítí ve tmě vlastním světlem.'
    ],
    animals:[
      {emoji:'🐋', name:'Velryba modrá', photo:'https://upload.wikimedia.org/wikipedia/commons/thumb/1/1c/Anim1754_-_Flickr_-_NOAA_Photo_Library.jpg/500px-Anim1754_-_Flickr_-_NOAA_Photo_Library.jpg', facts:['Je největší zvíře, které kdy žilo na Zemi.','Její srdce je velké jako malé auto.','Mláďata vypijí denně až 400 litrů mléka.','Její zpěv slyší jiné velryby na stovky kilometrů.']},
      {emoji:'🦈', name:'Žralok bílý', photo:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/56/White_shark.jpg/500px-White_shark.jpg', facts:['Má až 300 zubů ve více řadách.','Cítí kapku krve na velkou dálku.','Musí se stále hýbat, aby se nepotopil.','Dožívá se i 70 let.']},
      {emoji:'🐬', name:'Delfín skákavý', photo:'https://upload.wikimedia.org/wikipedia/commons/thumb/b/bc/Tursiops_truncatus_01-cropped.jpg/500px-Tursiops_truncatus_01-cropped.jpg', facts:['Spí jen s jedním zavřeným okem.','Každý delfín má své jméno – svou píseň.','Umí vyskočit vysoko nad hladinu.','Žije ve skupinách, kterým se říká tlupy.']},
      {emoji:'🐙', name:'Chobotnice', photo:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/57/Octopus2.jpg/500px-Octopus2.jpg', facts:['Má osm chytrých ramen plných přísavek.','Umí během sekundy změnit barvu i tvar.','Umí se protáhnout dírou velkou jako mince.','Má tři srdce, stejně jako oliheň.']},
      {emoji:'🐢', name:'Mořská želva', photo:'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a3/Green_sea_turtle_%28Chelonia_mydas%29_Moorea.jpg/500px-Green_sea_turtle_%28Chelonia_mydas%29_Moorea.jpg', facts:['Může se dožít více než 100 let.','Vrací se klást vejce na pláž, kde se narodila.','Mláďata se z vajíček klubou v noci.','Plave tisíce kilometrů přes celý oceán.']},
      {emoji:'🪼', name:'Medúza', photo:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/44/Jelly_cc11.jpg/500px-Jelly_cc11.jpg', facts:['Žije na světě déle než dinosauři.','Nemá mozek, srdce ani kosti.','Je tvořená z 95 % vodou.','Některé druhy umí lehce světélkovat.']},
      {emoji:'🦑', name:'Oliheň', photo:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Sepioteuthis_sepioidea_%28Caribbean_Reef_Squid%29.jpg/500px-Sepioteuthis_sepioidea_%28Caribbean_Reef_Squid%29.jpg', facts:['Plave jako tryskáč – vystřikuje vodu.','Má tři srdce a modrou krev.','Umí měnit barvu, aby se schovala.','Vystřikuje černý inkoust, když má strach.']},
      {emoji:'🦀', name:'Krab', photo:'https://upload.wikimedia.org/wikipedia/commons/thumb/7/71/Cancer_pagurus.jpg/500px-Cancer_pagurus.jpg', facts:['Chodí bokem, aby byl rychlejší.','Když ztratí klepeto, doroste mu nové.','Má pevný pancíř, který chrání jeho tělo.','Některé druhy umí i šplhat na stromy.']},
      {emoji:'🐡', name:'Ježík mořský', photo:'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a6/Pez_erizo_moteado_%28Diodon_hystrix%29%2C_Cabo_Pulmo%2C_Baja_California%2C_M%C3%A9xico%2C_2024-12-19%2C_DD_23.jpg/500px-Pez_erizo_moteado_%28Diodon_hystrix%29%2C_Cabo_Pulmo%2C_Baja_California%2C_M%C3%A9xico%2C_2024-12-19%2C_DD_23.jpg', facts:['Když se bojí, nafoukne se jako balón.','Má ostré bodliny po celém těle.','Někteří mají v těle silný jed.','Jeho zuby rostou pořád dokola jako u zajíce.']}
    ],
    quiz:[
      {q:'Které zvíře je největší na světě?', options:['Žralok','Velryba modrá','Delfín'], correct:1},
      {q:'Kolik srdcí má oliheň?', options:['Jedno','Dvě','Tři'], correct:2},
      {q:'Co dělá chobotnice, když se chce schovat?', options:['Změní barvu','Vyskočí z vody','Usne'], correct:0},
      {q:'Jak dlouho může žít mořská želva?', options:['10 let','Přes 100 let','5 let'], correct:1},
      {q:'Co dělá ježík mořský, když se bojí?', options:['Schová se do písku','Nafoukne se','Změní barvu'], correct:1},
      {q:'Co dělá žralok bílý, aby se nepotopil?', options:['Musí se stále hýbat','Spí na dně','Plave pozadu'], correct:0},
      {q:'Jak spí delfín skákavý?', options:['S oběma zavřenýma očima','S jedním zavřeným okem','Nespí vůbec'], correct:1},

}
function saveBadge(id){
  const b = getBadges();
  if(!b.includes(id)){
    b.push(id);
    try{ localStorage.setItem('habitatBadges', JSON.stringify(b)); }catch(e){}
  }
}

/* Replace a photo <img> with its emoji fallback if the image fails to load */
function imgFallback(img, emoji, modal){
  if(modal){
    const div = document.createElement('div');
    div.className='modal-emoji';
    div.textContent = emoji;
    img.replaceWith(div);
  }else{
    img.replaceWith(document.createTextNode(emoji));
  }
}

/* Shuffle helper (Fisher-Yates) */
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
/* Pick a random subset of quiz questions for a habitat (so quizzes vary each time) */
function pickQuiz(h){
  const count = Math.min(5, h.quiz.length);
  return shuffleArray(h.quiz).slice(0, count);
}

/* =======================================================
   SOUND EFFECTS (Web Audio, no files needed)
   ======================================================= */
let audioCtx;
function getCtx(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  }
  return audioCtx;
}
function beep(freq, duration, type='sine', delay=0, vol=0.2){
  try{
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = vol;
    osc.connect(gain);
    gain.connect(ctx.destination);
    const start = ctx.currentTime + delay;
    osc.start(start);
    gain.gain.setValueAtTime(vol, start);
    gain.gain.exponentialRampToValueAtTime(0.001, start+duration);
    osc.stop(start+duration);
  }catch(e){}
}
function playCorrect(){ beep(523.25,0.15,'sine',0,0.25); beep(783.99,0.2,'sine',0.12,0.25); }
function playWrong(){ beep(200,0.3,'sawtooth',0,0.15); }
function playBadge(){
  [523.25,659.25,783.99,1046.5].forEach((f,i)=>beep(f,0.25,'triangle',i*0.12,0.2));
}

/* =======================================================
   CONFETTI
   ======================================================= */
function launchConfetti(){
  const colors=['#ff5d8f','#ffd60a','#9d4edd','#40916c','#48cae4','#ff8fab'];
  for(let i=0;i<40;i++){
    const c = document.createElement('div');
    c.className='confetti';
    c.style.left = Math.random()*100+'vw';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDuration = (2+Math.random()*1.5)+'s';
    c.style.opacity = (0.7+Math.random()*0.3);
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 4000);
  }
}

/* =======================================================
   RENDER FUNCTIONS
   ======================================================= */
const app = document.getElementById('app');

function setTheme(theme){
  document.body.className = theme ? 'theme-'+theme : '';
}

function render(){
  if(state.screen==='home') renderHome();
  else if(state.screen==='habitat') renderHabitat();
  else if(state.screen==='quiz') renderQuiz();
  else if(state.screen==='result') renderResult();
  else if(state.screen==='badges') renderBadges();
}

function renderHome(){
  setTheme(null);
  const badges = getBadges();
  let cards = HABITATS.map(h=>{
    const has = badges.includes(h.id);
    return `<button class="habitat-card ${h.card}" data-go="${h.id}">
      ${has?'<div class="badge-check">⭐</div>':''}
      <span class="emoji">${h.emoji}</span>
      ${h.name}
    </button>`;
  }).join('');

  app.innerHTML = `
    <div class="topbar">
      <div class="title-row"><span class="big-title">🌍 Objevuj Zeměkouli!</span></div>
      <div class="badge-counter" id="goBadges">🏅 ${badges.length}/${HABITATS.length}</div>
    </div>
    <div class="home-intro">
      <h1>Vyber si biotop a poznej zvířata!</h1>
      <p>Klikni na zvířátko, přečti si o něm a pak si zahraj kvíz! 🎉</p>
    </div>
    <div class="habitat-grid">${cards}</div>
    <div class="footer-note">Vyrobeno s ❤️ pro malé objevitele přírody</div>
  `;

  document.querySelectorAll('[data-go]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.screen='habitat';
      state.habitatId = el.getAttribute('data-go');
      render();
    });
  });
  document.getElementById('goBadges').addEventListener('click', ()=>{
    state.screen='badges';
    render();
  });
}

function renderHabitat(){
  const h = HABITATS.find(x=>x.id===state.habitatId);
  setTheme(h.theme);

  const animalSpots = h.animals.map((a,i)=>`
    <button class="animal-spot" data-animal="${i}">
      <div class="animal-circle">${a.photo ? `<img src="${a.photo}" alt="${a.name}" loading="lazy" onerror="imgFallback(this,'${a.emoji}',false)">` : a.emoji}</div>
      <div class="animal-name">${a.name}</div>
    </button>
  `).join('');

  app.innerHTML = `
    <div class="topbar">
      <button class="icon-btn" id="goHome">🏠</button>
      <div class="title-row"></div>
      <div class="badge-counter" id="goBadges">🏅 ${getBadges().length}/${HABITATS.length}</div>
    </div>
    <div class="habitat-banner ${h.card}">
      <span class="emoji-big">${h.emoji}</span>
      <h2>${h.name}</h2>
      <div style="font-weight:600; margin-top:4px;">${h.intro}</div>
    </div>
    <div class="animal-grid">${animalSpots}</div>
    <div class="dyk-box">
      <div class="dyk-title">🌟 Víš, že...?</div>
      ${h.didYouKnow.map(f=>`<p>${f}</p>`).join('')}
    </div>
    <button class="quiz-cta" id="startQuiz">📝 Spustit kvíz o biotopu ${h.name}!</button>
  `;

  document.getElementById('goHome').addEventListener('click', ()=>{
    state.screen='home'; render();
  });
  document.getElementById('goBadges').addEventListener('click', ()=>{
    state.screen='badges'; render();
  });
  document.querySelectorAll('[data-animal]').forEach(el=>{
    el.addEventListener('click', ()=>{
      showAnimalModal(h, parseInt(el.getAttribute('data-animal')));
    });
  });
  document.getElementById('startQuiz').addEventListener('click', ()=>{
    state.screen='quiz';
    state.activeQuiz=pickQuiz(h);
    state.quizIndex=0;
    state.quizScore=0;
    state.answered=false;
    render();
  });
}

function showAnimalModal(habitat, idx){
  const a = habitat.animals[idx];
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML = `
    <div class="modal-card">
      <button class="modal-close" id="closeModal">✖️</button>
      ${a.photo ? `<img class="modal-photo" src="${a.photo}" alt="${a.name}" loading="lazy" onerror="imgFallback(this,'${a.emoji}',true)">` : `<div class="modal-emoji">${a.emoji}</div>`}
      <h3>${a.name}</h3>
      ${a.facts.map(f=>`<div class="fact-row"><span class="fact-emoji">✨</span><span>${f}</span></div>`).join('')}
    </div>
  `;
  document.body.appendChild(overlay);
  const close = ()=>overlay.remove();
  overlay.querySelector('#closeModal').addEventListener('click', close);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
}

function renderQuiz(){
  const h = HABITATS.find(x=>x.id===state.habitatId);
  setTheme(h.theme);
  const quiz = state.activeQuiz;
  const q = quiz[state.quizIndex];

  const dots = quiz.map((_,i)=>{
    let cls='quiz-dot';
    if(i<state.quizIndex) cls+=' done';
    else if(i===state.quizIndex) cls+=' current';
    return `<div class="${cls}"></div>`;
  }).join('');

  const options = q.options.map((opt,i)=>`<button class="quiz-option" data-opt="${i}">${opt}</button>`).join('');

  app.innerHTML = `
    <div class="topbar">
      <button class="icon-btn" id="goHome">🏠</button>
      <div class="title-row"></div>
      <div class="badge-counter">❓ ${state.quizIndex+1}/${quiz.length}</div>
    </div>
    <div class="habitat-banner ${h.card}">
      <span class="emoji-big">${h.emoji}</span>
      <h2>Kvíz: ${h.name}</h2>
    </div>
    <div class="quiz-progress">${dots}</div>
    <div class="quiz-card">
      <h3>${q.q}</h3>
      <div class="quiz-options">${options}</div>
      <div class="quiz-feedback" id="feedback"></div>
      <div id="nextWrap"></div>
    </div>
  `;

  document.getElementById('goHome').addEventListener('click', ()=>{
    state.screen='home'; render();
  });

  document.querySelectorAll('.quiz-option').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(state.answered) return;
      state.answered = true;
      const chosen = parseInt(btn.getAttribute('data-opt'));
      const feedback = document.getElementById('feedback');
      document.querySelectorAll('.quiz-option').forEach(b=>b.disabled=true);

      if(chosen===q.correct){
        btn.classList.add('correct');
        feedback.textContent = '✅ Správně! Skvělá práce!';
        feedback.className='quiz-feedback correct';
        state.quizScore++;
        playCorrect();
      }else{
        btn.classList.add('wrong');
        document.querySelector(`[data-opt="${q.correct}"]`).classList.add('correct');
        feedback.textContent = '❌ To nebylo ono, ale zkoušej dál!';
        feedback.className='quiz-feedback wrong';
        playWrong();
      }

      const nextWrap = document.getElementById('nextWrap');
      const isLast = state.quizIndex === quiz.length-1;
      const btnLabel = isLast ? '🏁 Zobrazit výsledek' : '➡️ Další otázka';
      nextWrap.innerHTML = `<button class="next-btn" id="nextBtn">${btnLabel}</button>`;
      document.getElementById('nextBtn').addEventListener('click', ()=>{
        if(isLast){
          state.screen='result';
        }else{
          state.quizIndex++;
          state.answered=false;
        }
        render();
      });
    });
  });
}

function renderResult(){
  const h = HABITATS.find(x=>x.id===state.habitatId);
  setTheme(h.theme);
  const total = state.activeQuiz.length;
  const score = state.quizScore;
  const passed = score >= Math.ceil(total*0.6);

  let title, msg, emoji;
  if(score===total){ title='Perfektní výsledek!'; msg='Trefil/a jsi úplně všechno! Jsi malý/á expert/ka!'; emoji='🏆'; }
  else if(passed){ title='Super práce!'; msg='Zvládl/a jsi to a vysloužil/a sis odznak!'; emoji='🎉'; }
  else{ title='Skoro to bylo!'; msg='Zkus si to ještě jednou a získej odznak!'; emoji='💪'; }

  let badgeHtml='';
  if(passed){
    const already = getBadges().includes(h.id);
    saveBadge(h.id);
    badgeHtml = `<div class="result-badge ${h.card}">${h.emoji}</div>
      <p>${already? 'Odznak '+h.name+' už máš ve sbírce!' : 'Nový odznak '+h.name+' je ve tvé sbírce!'}</p>`;
  }

  app.innerHTML = `
    <div class="topbar">
      <button class="icon-btn" id="goHome">🏠</button>
      <div class="title-row"></div>
      <div class="badge-counter" id="goBadges2">🏅 ${getBadges().length}/${HABITATS.length}</div>
    </div>
    <div class="result-card">
      <span class="result-emoji">${emoji}</span>
      <h3>${title}</h3>
      <p>Body: ${score} / ${total}</p>
      <p>${msg}</p>
      ${badgeHtml}
      <div class="result-actions">
        <button class="btn-retry" id="retryQuiz">🔁 Zkusit kvíz znovu</button>
        <button class="btn-home" id="backHabitat">🐾 Zpět k biotopu</button>
      </div>
    </div>
  `;

  document.getElementById('goHome').addEventListener('click', ()=>{ state.screen='home'; render(); });
  document.getElementById('goBadges2').addEventListener('click', ()=>{ state.screen='badges'; render(); });
  document.getElementById('retryQuiz').addEventListener('click', ()=>{
    state.screen='quiz'; state.activeQuiz=pickQuiz(h); state.quizIndex=0; state.quizScore=0; state.answered=false; render();
  });
  document.getElementById('backHabitat').addEventListener('click', ()=>{
    state.screen='habitat'; render();
  });

  if(passed){
    setTimeout(launchConfetti, 200);
    playBadge();
  }
}

function renderBadges(){
  setTheme(null);
  const badges = getBadges();
  const tiles = HABITATS.map(h=>{
    const has = badges.includes(h.id);
    return `<div class="badge-tile ${has?'':'locked'}">
      <div class="badge-circle ${has?h.card:''}">${has? h.emoji : '🔒'}</div>
      <div class="badge-name">${h.name}</div>
    </div>`;
  }).join('');

  app.innerHTML = `
    <div class="topbar">
      <button class="icon-btn" id="goHome">🏠</button>
      <div class="title-row"><span class="big-title">🏅 Sbírka odznaků</span></div>
      <div></div>
    </div>
    <div class="home-intro">
      <h1>Máš ${badges.length} z ${HABITATS.length} odznaků!</h1>
      <p>Splň kvíz v každém biotopu a sesbírej je všechny! 🌟</p>
    </div>
    <div class="badges-grid">${tiles}</div>
    <div class="footer-note">Pokračuj v objevování a sbírej další odznaky!</div>
  `;
  document.getElementById('goHome').addEventListener('click', ()=>{ state.screen='home'; render(); });
}

/* INIT */
render();
</script>
